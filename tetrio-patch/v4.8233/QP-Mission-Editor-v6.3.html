<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline QP ミッションエディタ v6.3</title>
<style>
 :root{color-scheme:dark;font:15px system-ui,sans-serif;background:#111018;color:#f8eee7}body{max-width:1100px;margin:auto;padding:24px}h1{margin:0}small,.note{color:#c8b9ae}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}.card{background:#201922;border:1px solid #754a36;border-radius:10px;padding:15px;margin:14px 0}label{display:grid;gap:5px}input,select,textarea,button{font:inherit;border-radius:6px;border:1px solid #946047;background:#15121a;color:#fff4ec;padding:8px}input[type=checkbox]{width:20px;height:20px}button{cursor:pointer;background:#71351f}button:hover{filter:brightness(1.2)}button.secondary{background:#343044}button.danger{background:#732b32}.checks{display:flex;flex-wrap:wrap;gap:14px}.checks label{display:flex;align-items:center;gap:7px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.mission{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #4c3540}.mission.active{background:#3c2630}.mission p{margin:3px 0}.status{min-height:1.5em;color:#ffc48e}.drop{border:2px dashed #a96a49;padding:18px;text-align:center;border-radius:8px}.hidden{display:none!important}textarea{width:100%;min-height:190px;box-sizing:border-box;font-family:ui-monospace,monospace}@media(max-width:600px){body{padding:12px}.mission{grid-template-columns:1fr}}
</style>
<body>
<h1>Offline QP ミッションエディタ <small>v6.3</small></h1>
<p class="note">端末内だけで使う復活ミッションJSONです。1〜10F、操作反転、表示制御、盤面回転と「他アプリを見る」を扱います。縦分割・横分割・4分割・周回と操作反転を組み合わせられます（本体v4.8233以降）。</p>

<section class="card">
 <div class="row"><button id="new">新規ミッション</button><button class="secondary" id="download">JSONを書き出す</button><button class="secondary" id="copy">JSONをコピー</button><label class="secondary"><span class="hidden">読み込み</span><input id="file" type="file" accept="application/json,.json" hidden><button type="button" id="pick">JSONを読み込む</button></label></div>
 <p id="status" class="status" aria-live="polite"></p>
 <div id="drop" class="drop">Offline QP画面と同様に、ここへミッションJSONをドロップして読み込めます。</div>
</section>

<main class="grid" style="grid-template-columns:minmax(260px,.8fr) minmax(440px,1.4fr)">
 <section class="card"><h2>ミッション一覧</h2><div id="list"></div></section>
 <section class="card"><h2>編集</h2>
  <div class="grid"><label>名前<input id="name" maxlength="48"></label><label>イベント<select id="event"><option value="pieces">ミノを置く</option><option value="survive">生存する</option><option value="lines">ラインを消す</option><option value="spin">スピンする</option><option value="attack">攻撃を送る</option><option value="leavewindow">他アプリを見る</option></select></label><label>目標<input id="target" type="number" min="1" max="999"></label><label>制限時間（秒、0=なし）<input id="timeout" type="number" min="0" max="600"></label></div>
  <h3>出現条件</h3><div class="grid"><label>フロア下限（1〜10）<input id="floorMin" type="number" min="1" max="10"></label><label>フロア上限（1〜10）<input id="floorMax" type="number" min="1" max="10"></label><label>復活回数下限<input id="reviveMin" type="number" min="0" max="99"></label><label>復活回数上限<input id="reviveMax" type="number" min="0" max="99"></label></div>
  <h3>効果</h3><div class="checks"><label><input id="reverseHorizontal" type="checkbox">左右操作を反転</label><label><input id="reverseRotation" type="checkbox">回転操作を反転</label><label><input id="boardRotation" type="checkbox">プレーヤー盤面を回転</label><label><input id="hideActive" type="checkbox">操作中ミノを非表示</label><label><input id="hideGhost" type="checkbox">ゴーストを非表示</label></div>
  <div class="grid"><label>盤面回転角度<input id="degrees" type="number" min="0" max="360"></label><label>回転時間（ms）<input id="durationMs" type="number" min="0" max="3000"></label></div>
  <div class="grid"><label>画面効果<select id="screenMode"><option value="none">なし</option><option value="vertical">縦分割（5列ずつ）</option><option value="horizontal">横分割（10段ずつ）</option><option value="quad">4分割（縦＋横）</option><option value="orbit">ゆっくり周回</option></select></label></div>
  <h3>進捗リセット</h3><div class="checks"><label><input type="checkbox" id="resetOnMismatch">設置条件が不一致なら進捗を0に戻す</label></div>
  <p class="note">押したときに進捗を0に戻す操作</p><div class="checks" id="resetKeys"></div>
  <p class="note">「他アプリを見る」は、TETR.IOが非アクティブになったことだけを検知します。どのアプリを見たかは取得しません。</p>
  <div class="row"><button id="save">この内容を保存</button><button class="danger" id="remove">選択中を削除</button></div>
 </section>
</main>

<section class="card"><h2>JSON確認／貼り付け読み込み</h2><textarea id="json" spellcheck="false"></textarea><div class="row"><button class="secondary" id="fromText">上のJSONを読み込む</button><button class="secondary" id="refresh">現在の内容を表示</button></div></section>

<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id), clamp=(v,min,max)=>{const n=Number(v);if(!Number.isInteger(n)||n<min||n>max)throw Error(`${min}〜${max}の整数を入力してください`);return n};
 const id=()=>`custom_${crypto.randomUUID().replaceAll('-','').slice(0,20)}`;
 const base=()=>({id:id(),source:'custom',name:'新しいミッション',event:'pieces',target:1,count:1,timeout:0,timerStart:'immediate',mods:[],mod:'',modLabels:[],applyModRules:true,penaltyEvents:['pieces'],requiresAttack:false,rank:null,rankMode:'auto',rules:{piece:'',pieces:[],facing:'',facings:[],holdRequired:false,columnMin:1,columnMax:10,height:{enabled:false,rows:0,compare:'atMost',requireCrossing:true},lines:{enabled:false,compare:'exact',count:1},resetOn:[],resetOnMismatch:false,rotationInput:'any',softDrop:'any',horizontal:'any',spinType:'any'},when:{floorMin:1,floorMax:10,reviveMin:0,reviveMax:99,modsAll:[],modsNone:[]},effects:{visibility:{hold:true,holdContent:true,next:true,nextCount:5,nextHidden:[],nextWhenSpawnSlots:[],nextSlots:Array.from({length:6},()=>({mode:'normal',visiblePercent:100,period:5})),nextWhenSpawnHidden:false,modes:{stack:{mode:'normal'},garbage:{mode:'normal'},active:{mode:'normal'},ghost:{mode:'normal'},next:{mode:'normal'},hold:{mode:'normal'}}},holdEnabled:true,sound:{rotation:true},boardRotation:{enabled:false,mode:'fixed',degrees:180,durationMs:700},screen:{mode:'none'},controls:{reverseHorizontal:false,reverseRotation:false}}});
 const resetKeys=[['hold','HOLD'],['moveLeft','左移動'],['moveRight','右移動'],['rotateCW','右回転'],['rotateCCW','左回転'],['rotate180','180度回転'],['softDrop','ソフトドロップ'],['hardDrop','ハードドロップ']];
 for(const [key,label]of resetKeys){const row=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.dataset.resetKey=key;row.append(input,document.createTextNode(label));$('resetKeys').append(row)}
 let data={schema:9,starterInstalled:true,testSequence:['','',''],missions:[base()]},selected=0;
 const status=text=>{$('status').textContent=text};
 function normalize(raw){const m={...base(),...raw};m.id=String(m.id||id()).replace(/[^a-z0-9_-]/gi,'').slice(0,52)||id();m.name=String(m.name||'新しいミッション').trim().slice(0,48);if(!m.name)throw Error('名前を入力してください');m.event=String(m.event||'pieces');if(!/^[a-z][a-z0-9_]{0,39}$/.test(m.event))throw Error('イベントIDが不正です');m.target=m.count=clamp(m.target??1,1,999);m.timeout=clamp(m.timeout??0,0,600);m.when={...base().when,...m.when};m.when.floorMin=clamp(Math.min(10,m.when.floorMin),1,10);m.when.floorMax=clamp(Math.min(10,m.when.floorMax),1,10);m.when.reviveMin=clamp(m.when.reviveMin,0,99);m.when.reviveMax=clamp(m.when.reviveMax,0,99);if(m.when.floorMin>m.when.floorMax||m.when.reviveMin>m.when.reviveMax)throw Error('条件の範囲が逆です');m.effects={...base().effects,...m.effects,visibility:{...base().effects.visibility,...m.effects?.visibility},boardRotation:{...base().effects.boardRotation,...m.effects?.boardRotation},controls:{...base().effects.controls,...m.effects?.controls}};m.effects.boardRotation.enabled=m.effects.boardRotation.enabled===true;m.effects.boardRotation.degrees=clamp(m.effects.boardRotation.degrees,0,360);m.effects.boardRotation.durationMs=clamp(m.effects.boardRotation.durationMs,0,3000);for(const key of ['active','ghost']){const rule=m.effects.visibility.modes[key]||{};m.effects.visibility.modes[key]={...rule,mode:rule.mode==='hidden'?'hidden':'normal',visiblePercent:100,period:5,afterLock:false}};m.rules={...base().rules,...m.rules};m.rules.resetOn=(m.rules.resetOn||[]).filter(key=>resetKeys.some(row=>row[0]===key));m.rules.resetOnMismatch=m.rules.resetOnMismatch===true;m.effects.screen={mode:['none','vertical','horizontal','quad','orbit'].includes(m.effects.screen?.mode)?m.effects.screen.mode:'none'};m.effects.controls.reverseHorizontal=m.effects.controls.reverseHorizontal===true;m.effects.controls.reverseRotation=m.effects.controls.reverseRotation===true;m.penaltyEvents=m.event==='leavewindow'?[]:[m.event];return m}
 function active(){return data.missions[selected]}
 function render(){data.missions=data.missions.map(normalize);if(selected>=data.missions.length)selected=Math.max(0,data.missions.length-1);$('list').innerHTML='';data.missions.forEach((m,i)=>{const e=document.createElement('div');e.className='mission'+(i===selected?' active':'');e.innerHTML=`<div><strong>${m.name}</strong><p>${m.event==='leavewindow'?'他アプリを見る':m.event} · ${m.when.floorMin}F〜${m.when.floorMax}F</p></div><button class="secondary">編集</button><button class="danger">削除</button>`;e.querySelectorAll('button')[0].onclick=()=>{selected=i;render()};e.querySelectorAll('button')[1].onclick=()=>{data.missions.splice(i,1);if(!data.missions.length)data.missions.push(base());selected=0;render()};$('list').append(e)});fill();$('json').value=JSON.stringify(data,null,2)}
 function fill(){const m=active(),event=$('event');if(![...event.options].some(x=>x.value===m.event)){const option=document.createElement('option');option.value=m.event;option.textContent=`既存イベント: ${m.event}`;event.append(option)}$('name').value=m.name;event.value=m.event;$('target').value=m.target;$('timeout').value=m.timeout;for(const x of ['floorMin','floorMax','reviveMin','reviveMax'])$(x).value=m.when[x];$('reverseHorizontal').checked=m.effects.controls.reverseHorizontal;$('reverseRotation').checked=m.effects.controls.reverseRotation;$('boardRotation').checked=m.effects.boardRotation.enabled;$('hideActive').checked=m.effects.visibility.modes.active.mode==='hidden';$('hideGhost').checked=m.effects.visibility.modes.ghost.mode==='hidden';$('screenMode').value=m.effects.screen.mode;$('resetOnMismatch').checked=m.rules.resetOnMismatch;for(const input of $('resetKeys').querySelectorAll('input'))input.checked=m.rules.resetOn.includes(input.dataset.resetKey);$('degrees').value=m.effects.boardRotation.degrees;$('durationMs').value=m.effects.boardRotation.durationMs}
 function save(){const m=active();m.name=$('name').value;m.event=$('event').value;m.target=$('target').value;m.timeout=$('timeout').value;for(const x of ['floorMin','floorMax','reviveMin','reviveMax'])m.when[x]=$(x).value;m.effects.controls.reverseHorizontal=$('reverseHorizontal').checked;m.effects.controls.reverseRotation=$('reverseRotation').checked;m.effects.boardRotation.enabled=$('boardRotation').checked;m.effects.visibility.modes.active.mode=$('hideActive').checked?'hidden':'normal';m.effects.visibility.modes.ghost.mode=$('hideGhost').checked?'hidden':'normal';m.effects.screen={mode:$('screenMode').value};m.rules.resetOnMismatch=$('resetOnMismatch').checked;m.rules.resetOn=[...$('resetKeys').querySelectorAll('input:checked')].map(input=>input.dataset.resetKey);m.effects.boardRotation.degrees=$('degrees').value;m.effects.boardRotation.durationMs=$('durationMs').value;data.missions[selected]=normalize(m);status('保存しました');render()}
 async function load(file){const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed?.missions))throw Error('missions 配列がありません');data={schema:9,starterInstalled:parsed.starterInstalled!==false,testSequence:Array.isArray(parsed.testSequence)?parsed.testSequence.slice(0,3):['','',''],missions:parsed.missions.map(normalize)};if(!data.missions.length)data.missions=[base()];selected=0;status(`${data.missions.length}件を読み込みました`);render()}
 $('new').onclick=()=>{data.missions.push(base());selected=data.missions.length-1;render()};$('save').onclick=()=>{try{save()}catch(e){status('保存失敗：'+e.message)}};$('remove').onclick=()=>{data.missions.splice(selected,1);if(!data.missions.length)data.missions=[base()];selected=0;render()};$('pick').onclick=()=>$('file').click();$('file').onchange=()=>{const f=$('file').files[0];if(f)load(f).catch(e=>status('読込失敗：'+e.message))};$('drop').ondragover=e=>{e.preventDefault();$('drop').style.background='#3b2530'};$('drop').ondragleave=()=>{$('drop').style.background=''};$('drop').ondrop=e=>{e.preventDefault();$('drop').style.background='';const f=e.dataTransfer.files[0];if(f)load(f).catch(err=>status('読込失敗：'+err.message))};$('fromText').onclick=()=>{try{const parsed=JSON.parse($('json').value);data={schema:9,starterInstalled:parsed.starterInstalled!==false,testSequence:parsed.testSequence||['','',''],missions:parsed.missions.map(normalize)};selected=0;render();status('貼り付けJSONを読み込みました')}catch(e){status('読込失敗：'+e.message)}};$('refresh').onclick=render;$('download').onclick=()=>{render();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('json').value],{type:'application/json'}));a.download='tetrio-local-revive-missions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('copy').onclick=async()=>{render();await navigator.clipboard.writeText($('json').value);status('JSONをコピーしました')};render();
})();
</script>
</body></html>
