<style>

*{box-sizing:border-box}body{margin:0;color:var(--tx);background:var(--bg);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}

.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border)}
h1{font-size:17px;margin:0 auto 0 0}h3{margin:0 0 8px;font-size:14px}small,.help{color:var(--sub);font-size:12px;display:block}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;padding:7px 12px;border:1px solid var(--border);border-radius:8px}.menu>div{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;display:grid;gap:6px;min-width:220px;z-index:6}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;padding:14px 20px;align-items:start}
aside{position:sticky;top:64px;display:grid;gap:10px}.card,.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}.box{margin-bottom:12px}
.list{display:grid;gap:6px;max-height:calc(100vh - 330px);min-height:160px;overflow:auto;margin-top:8px}
.mission{display:flex;gap:9px;align-items:center;text-align:left;width:100%}.mission[aria-selected=true]{outline:2px solid var(--accent);background:var(--soft)}.mission b{display:block;overflow-wrap:anywhere}
.rank{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;font-weight:700;font-size:12px;color:#fff;background:#7b7f91}
[data-r=E]{background:#2f8f5b}[data-r=D]{background:#2f78c4}[data-r=C]{background:#7a4fd0}[data-r=B]{background:#c7771c}[data-r=A]{background:#c23b45}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.chip{border-radius:99px;padding:4px 11px;font-size:13px}.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.tabs{display:flex;gap:4px;overflow:auto;margin:10px 0 12px;border-bottom:1px solid var(--border)}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;white-space:nowrap}.tabs button[aria-selected=true]{border-color:var(--accent);font-weight:700}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top h2{font-size:18px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.fld{display:grid;gap:3px;margin-bottom:10px;font-size:12px;color:var(--sub)}.fld input,.fld select{width:100%;font-size:14px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.seg{display:flex;gap:4px}.seg button{flex:1}
.sw{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer}.sw input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.ap{display:grid;grid-template-columns:150px 150px 1fr 1fr;gap:6px 10px;align-items:end;padding:8px 0;border-top:1px solid var(--border)}.ap .fld{margin:0}.ap b{align-self:center}
.strip{display:flex;gap:6px;margin:8px 0}.nx{flex:1;padding:10px 0;text-align:center}.nx[aria-pressed=true]{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px);color:var(--sub);text-decoration:line-through}.nx:disabled{opacity:.35}
textarea{width:100%;height:200px;font:12px/1.4 ui-monospace,Menlo,monospace}details>summary{cursor:pointer;color:var(--sub)}
#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;display:none;z-index:20;max-width:92vw}#status.show{display:block}#status.error{background:var(--error);color:#fff}#status button{margin-left:8px;padding:2px 9px}
dialog{width:min(560px,94vw);border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--tx);padding:14px}dialog::backdrop{background:#0008}#tplList{display:grid;gap:5px;max-height:60vh;overflow:auto;margin-top:8px}
#drop{position:fixed;inset:0;background:#5647cf99;color:#fff;display:none;place-items:center;font-size:22px;z-index:30}#drop.on{display:grid}
@media(max-width:820px){main{display:block;padding:10px}aside{position:static;margin-bottom:12px}.list{max-height:34vh}.ap{grid-template-columns:1fr 1fr}.ap b{grid-column:1/-1}header{padding:8px 10px}}
</style>

<header><h1>QP 復活ミッションエディタ</h1>
<button id="add">＋ 新規</button><button id="chooseFile">開く</button><button id="download" class="primary">保存</button>
<details class="menu"><summary>⋯ その他</summary><div>
<label class="fld">ミッション名の表示言語<select id="nameView"><option value="ja">日本語</option><option value="original">英語の原文</option></select></label>
<button id="copy">JSONをコピー</button><button id="random">🎲 ランダムに1件作る</button></div></details>

<main>
<aside>

 <details class="card"><summary>復活テスト：1～3番目を固定</summary><p class="help">未指定ならランダム。復活開始時にここで選んだミッションが優先されます。</p><div id="testSequence"></div></details>
</aside>
<section><div class="card" id="editor"></div>
 <details class="card" style="margin-top:12px"><summary>JSON（上級者向け）— 保存・開くで足りるので通常は不要です</summary><textarea id="json" spellcheck="false"></textarea><div class="chips"><button id="loadText">テキストから読み込む</button></div></details>
 <p class="help">ゲームには組み込まない独立ページです。保存したJSONをゲーム側で読み込んでください。JSON / TXTファイルはこのページにドラッグ＆ドロップでも開けます。編集内容はこのブラウザに自動で一時保存されます。</p></section>
</main>
<dialog id="tpl"><div class="top"><h2>公式ミッションから追加</h2><button id="tplClose">✕</button></div><input id="tplQ" type="search" placeholder="検索（例：スピン、コンボ、E）" style="width:100%;margin-top:8px"><div id="tplList"></div></dialog>

// エクスポートしたJSONだけでなく、テキストとして共有されたJSONもそのまま読み込む。
function parseMissionText(text){
 let body=String(text??'').replace(/^\uFEFF/,'').trim();
 const fenced=body.match(/^```(?:json|JSON)?\s*\n([\s\S]*?)\n```\s*$/);
 if(fenced)body=fenced[1].trim();
 if(!body)throw Error('ファイルにJSONデータがありません');
 try{return JSON.parse(body)}catch(err){throw Error('JSONの形式を確認してください：'+err.message)}
}

}

}

function redraw(){drawList();drawEditor()}
function changed(re){dirty=true;try{localStorage.setItem(DRAFT,JSON.stringify(data))}catch{}drawList();if(re)drawEditor()}
function append(m){data.missions.splice(selected+1,0,m);selected++;filter='ALL';query='';$('q').value='';dirty=true;try{localStorage.setItem(DRAFT,JSON.stringify(data))}catch{}redraw();status('追加しました')}
function addTemplate(i){const p=OFFICIAL[i],m=fresh(['',p.id,p.target,0,p.rank,p.label,`template_${p.id}_${Date.now()}`]);
 // Known official Spin variants are expressed by shared Spin + piece + line + facing rules.
 const compound={tspinsingle:{pieces:['T'],lines:1},tspindouble:{pieces:['T'],lines:2},tspintriple:{pieces:['T'],lines:3},tspindoubleup:{pieces:['T'],lines:2,facings:[0]},
  szspin:{pieces:['S','Z']},ljspin:{pieces:['L','J']},ispinclear:{pieces:['I']},szljspin:{pieces:['S','Z','L','J']},
  szspintriple:{pieces:['S','Z'],lines:3},ljspintriple:{pieces:['L','J'],lines:3},ispindouble:{pieces:['I'],lines:2},
  noclearspin:{lines:0}}[p.id];
 if(compound){m.event='spin';m.rules.pieces=compound.pieces||[];m.rules.piece=m.rules.pieces.length===1?m.rules.pieces[0]:'';m.rules.facings=compound.facings||[];m.rules.facing=m.rules.facings.length===1?m.rules.facings[0]:'';if(compound.lines!==undefined)m.rules.lines={enabled:true,compare:'exact',count:compound.lines};}
if(p.exclude&&MODS.includes(p.exclude))m.when.modsNone=[p.exclude];m.requiresAttack=['attack','ljgarbage','szgarbage','receive','received'].includes(p.id);$('tpl').close();append(m)}
function drawTpl(){const q=tplQuery.trim().toLowerCase();$('tplList').innerHTML=OFFICIAL.map((p,i)=>({p,i,t:`${p.rank}ランク ${templateJa(p,p.target)}`})).filter(x=>!q||x.t.toLowerCase().includes(q)).map(({p,i,t})=>`<button type="button" class="mission" data-tpl="${i}"><span class="rank" data-r="${p.rank}">${p.rank}</span><span>${esc(t)}<small>目標 ${p.target}</small></span></button>`).join('')||'<small>該当なし</small>'}
function save(){try{const c=exportData(),u=URL.createObjectURL(new Blob([c],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='qp-revive-missions-v5.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);dirty=false;rememberOpened();drawList();status('保存しました')}catch(err){status(err.message,true)}}
async function openFile(f){try{if(!f)return;if(f.size>1024*1024)throw Error('ファイルが1MBを超えています');importText(await f.text())}catch(err){status('読み込み失敗：'+err.message,true)}}

$('editor').addEventListener('change',ev=>{const el=ev.target,p=el.dataset.p,m=M();if(!p||!m)return;let v=el.type==='checkbox'?el.checked:el.value;
 if(el.type==='number'){v=Math.min(+el.max,Math.max(+el.min,Math.round(Number(el.value))||+el.min));el.value=v}
 if(p==='penaltyEvents')v=[...new Set(v.split(',').map(s=>s.trim()).filter(Boolean))];
 if(p==='event'&&!v)return;setP(m,p,v);if(p==='target')m.count=v;
 if(p==='event'){if(!v)return;m.timerStart=v==='lines'?'first-clear':'immediate';m.requiresAttack=['attack','ljgarbage','szgarbage'].includes(v);if(v==='pieceheight')m.rules.height.enabled=true;else if(v!=='pieces')m.rules.height.enabled=false}
 changed(!!el.dataset.re||['event','timeout','effects.boardRotation.enabled','effects.boardRotation.mode','effects.visibility.nextCount','rules.height.enabled','target'].includes(p)&&p!=='target')});
$('editor').addEventListener('click',ev=>{const t=ev.target.closest('button'),m=M();if(!t||!m)return;const d=t.dataset;
 if(d.tab){tab=d.tab;drawEditor()}
 else if(d.seg){m.rankMode=d.seg==='AUTO'?'auto':'fixed';m.rank=d.seg==='AUTO'?null:d.seg;changed(true)}
 else if(d.pick){const list=getP(m,d.pick)||[],x=d.pick==='rules.facings'?Number(d.v):d.v;setP(m,d.pick,list.includes(x)?list.filter(item=>item!==x):[...list,x]);
   if(d.pick==='rules.pieces')m.rules.piece=m.rules.pieces.length===1?m.rules.pieces[0]:'';
   if(d.pick==='rules.facings')m.rules.facing=m.rules.facings.length===1?m.rules.facings[0]:'';
   changed(true)}
 else if(d.chip){const on=getP(m,d.chip)||[],old=[...on],v=d.v,twin=v.endsWith('_reversed')?v.replace('_reversed',''):v+'_reversed';const next=on.includes(v)?on.filter(x=>x!==v):[...on.filter(x=>x!==twin),v];setP(m,d.chip,next);
  if(d.chip==='mods'){m.mod=next[0]||'';if(JSON.stringify(old)===JSON.stringify(m.modLabels))m.modLabels=[...next]}changed(true)}
 else if(d.nh){const x=Number(d.nh),h=m.effects.visibility.nextHidden||[];m.effects.visibility.nextHidden=(h.includes(x)?h.filter(k=>k!==x):[...h,x]).sort();if(!h.includes(x))m.effects.visibility.next=true;changed(true)}
 else if(d.ns){const x=Number(d.ns),h=m.effects.visibility.nextWhenSpawnSlots||[];m.effects.visibility.nextWhenSpawnSlots=(h.includes(x)?h.filter(k=>k!==x):[...h,x]).sort();changed(true)}
 else if(t.id==='dup'){const x=clone(m);x.id+='_'+Date.now();x.name=m.name+' (copy)';append(x)}
 else if(t.id==='del'){const i=selected,gone=data.missions.splice(i,1)[0];selected=Math.max(0,Math.min(i,data.missions.length-1));dirty=true;changed(true);status('削除しました',false,['元に戻す',()=>{data.missions.splice(i,0,gone);selected=i;changed(true)}])}});
$('list').addEventListener('click',ev=>{const b=ev.target.closest('[data-i]');if(b){selected=Number(b.dataset.i);redraw();if(innerWidth<=820)$('editor').scrollIntoView({behavior:'smooth'})}});
$('filters').addEventListener('click',ev=>{const b=ev.target.closest('[data-f]');if(b){filter=b.dataset.f;drawList()}});
$('testSequence').addEventListener('change',ev=>{const s=ev.target;if(s.dataset.fixed!==undefined){data.testSequence[Number(s.dataset.fixed)]=s.value;changed(false)}});
$('q').oninput=e=>{query=e.target.value;drawList()};$('listOrder').onchange=e=>{sortMode=e.target.value;drawList()};
$('add').onclick=()=>append(fresh(['','pieces',6,0,null,'New Mission','custom_new_'+Date.now()]));
$('addTpl').onclick=()=>{tplQuery='';$('tplQ').value='';drawTpl();$('tpl').showModal()};$('tplClose').onclick=()=>$('tpl').close();
$('tplQ').oninput=e=>{tplQuery=e.target.value;drawTpl()};$('tplList').onclick=ev=>{const b=ev.target.closest('[data-tpl]');if(b)addTemplate(Number(b.dataset.tpl))};
$('random').onclick=()=>{const pick=a=>a[Math.floor(Math.random()*a.length)],event=pick(EVENTS),t=OFFICIAL.find(o=>o.id===event),mod=pick(MODS),target=t?.target||pick([2,3,4,6,8]);append({...fresh([mod,event,target,0,pick(['E','D','C','B','A']),`Custom: ${event} ${target}`,'custom_random_'+Date.now()]),requiresAttack:['attack','ljgarbage','szgarbage'].includes(event)})};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(exportData());status('コピーしました')}catch(err){status('コピーできませんでした：'+err.message,true)}};
$('download').onclick=save;$('chooseFile').onclick=()=>$('file').click();$('file').onchange=async e=>{await openFile(e.target.files[0]);e.target.value=''};
$('loadText').onclick=()=>{try{importText($('json').value)}catch(err){status('読み込み失敗：'+err.message,true)}};$('nameView').onchange=setLang;
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('on')});addEventListener('dragleave',e=>{if(!e.relatedTarget)$('drop').classList.remove('on')});
addEventListener('drop',async e=>{e.preventDefault();$('drop').classList.remove('on');await openFile(e.dataTransfer.files[0])});
redraw();
try{
 const draft=localStorage.getItem(DRAFT),previous=localStorage.getItem(LAST_OPENED);
 if(draft){
  importData(JSON.parse(draft));dirty=true;drawList();
  status('前回の編集中データを復元しました',false,['保存時の状態に戻す',()=>{try{localStorage.removeItem(DRAFT)}catch{}location.reload()}]);
 }else if(previous){
  importData(JSON.parse(previous));dirty=false;drawList();status('前回開いたデータを復元しました');
 }
}catch(err){status('保存済みデータの復元に失敗しました：'+err.message,true)}
</script></body></html>
